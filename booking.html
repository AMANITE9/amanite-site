<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Booking</title>

    <link rel="stylesheet"
          href="style.css">
</head>

<body>

    <!-- FOND FLOU -->

    <div class="blur-background"
         style="background-image:url('images/BOOKING.PNG')">
    </div>

    <!-- OVERLAY -->

    <div class="dark-overlay"></div>

    <!-- PAGE -->

    <div class="page-container">

        <!-- IMAGE -->

        <img src="images/BOOKING.PNG"
             class="page-image">

        <!-- BOUTONS -->

        <a href="day.html"
           class="bubble-link booking-day">
        </a>

        <a href="night.html"
           class="bubble-link booking-night">
        </a>

        <!-- FORMULAIRE BOOKING -->

        <div class="booking-form">

            <!-- NOM -->

            <input type="text"
                   id="name"
                   placeholder="Name:"
                   class="booking-input booking-name">

            <!-- EMAIL -->

            <input type="email"
                   id="email"
                   placeholder="Email:"
                   class="booking-input booking-email">

            <!-- MESSAGE -->

            <textarea id="message"
                      placeholder="MESSAGE"
                      class="booking-message">
            </textarea>

            <!-- SEND ZONE -->

            <div class="send-zone"
                 onclick="sendMail()">
            </div>

        </div>

    </div>

    <!-- TRANSITION -->

    <div class="fade-transition"></div>

<script>

/* ================= SEND MAIL ================= */

function sendMail(){

    const name =
    document.getElementById("name").value;

    const email =
    document.getElementById("email").value;

    const message =
    document.getElementById("message").value;

    const text =
    encodeURIComponent(

        "BOOKING REQUEST\n\n" +

        "Name: " + name + "\n\n" +

        "Email: " + email + "\n\n" +

        message
    );

    const isMobile =
    /Android|iPhone|iPad|iPod/i.test(
        navigator.userAgent
    );

    if(isMobile){

        window.open(

            `https://api.whatsapp.com/send?phone=33766715186&text=${text}`,
            "_self"
        );

    }else{

        window.open(

            `https://wa.me/33766715186?text=${text}`,
            "_blank"
        );
    }
}

/* ================================================= */
/* ================= PAGE TRANSITION =============== */
/* ================================================= */

window.addEventListener("DOMContentLoaded", () => {

    const fade =
    document.querySelector(".fade-transition");

    if(!fade) return;

    /* ================= FADE IN ================= */

    setTimeout(() => {

        fade.classList.add("hidden");

    }, 50);

    /* ================= FADE OUT ================= */

    document.querySelectorAll("a").forEach(link => {

        link.addEventListener("click", e => {

            const href =
            link.getAttribute("href");

            if(!href) return;

            e.preventDefault();

            fade.classList.remove("hidden");

            setTimeout(() => {

                window.location.href = href;

            }, 800);
        });
    });
});

</script>

</body>

</html>
