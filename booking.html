<!DOCTYPE html>
<html lang="fr">

<head>
    <!-- PRELOAD IMAGES -->

<link rel="preload"
      as="image"
      href="images/transition.PNG"
      fetchpriority="high">



<link rel="preload"
      as="image"
      href="images/DAY.PNG">

<link rel="preload"
      as="image"
      href="images/NIGHT.PNG">

<link rel="preload"
      as="image"
      href="images/BOOKING.PNG">

<!-- PRELOAD GALLERY -->

<link rel="preload"
      as="image"
      href="images/PROMODAY1.PNG">

<link rel="preload"
      as="image"
      href="images/PROMONIGHT1.PNG">

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Booking</title>

    <link rel="icon"
          type="image/png"
          href="images/favicon-amanite.png">

    <link rel="stylesheet"
          href="style.css">

          <!-- PREFETCH PAGES -->

<link rel="prefetch"
      href="day.html">

<link rel="prefetch"
      href="night.html">
      
</head>

<body>

    <!-- FOND FLOU -->

    <div class="blur-background"
         style="background-image:url('images/BOOKING.PNG')">
    </div>

    <!-- OVERLAY -->

    <div class="dark-overlay"></div>

    <!-- PAGE -->

    <div class="page-container">

        <!-- IMAGE -->

        <img src="images/BOOKING.PNG"
             class="page-image">

        <!-- BOUTONS -->

        <a href="day.html"
           class="bubble-link booking-day">
        </a>

        <a href="night.html"
           class="bubble-link booking-night">
        </a>

        <!-- CONTACTS : COPIE AU CLIC -->

        <button type="button"
                class="contact-copy contact-phone"
                data-copy="07.66.71.51.86"
                aria-label="Copier le numéro de téléphone">
        </button>

        <button type="button"
                class="contact-copy contact-email"
                data-copy="sacha.guillemin1@gmail.com"
                aria-label="Copier l'adresse e-mail">
        </button>

        <!-- FORMULAIRE BOOKING -->

        <div class="booking-form">

            <!-- NOM -->

            <input type="text"
                   id="name"
                   placeholder="Name:"
                   class="booking-input booking-name">

        
            <!-- MESSAGE -->
<textarea id="message"
          placeholder="Message:"
          class="booking-message"></textarea>
          

            <!-- SEND ZONE -->

            <span class="whatsapp-mark"
                  aria-hidden="true">
                <svg viewBox="0 0 24 24"
                     focusable="false">
                    <path d="M20.5 11.7a8.3 8.3 0 0 1-12.2 7.3L3.5 20.5l1.5-4.6a8.3 8.3 0 1 1 15.5-4.2Z"></path>
                    <path d="M9 7.9c.2-.4.4-.4.7-.4h.5c.2 0 .4.1.5.4l.8 1.9c.1.3.1.5 0 .7l-.5.6c-.2.2-.2.4 0 .7.5.9 1.3 1.7 2.3 2.2.3.2.5.2.7 0l.6-.7c.2-.2.4-.2.7-.1l1.8.8c.3.1.4.3.4.5v.5c0 .3-.1.5-.4.7-.5.4-1.2.5-1.8.4-1.1-.2-2.5-.9-3.9-2.2-1.4-1.3-2.3-2.8-2.6-3.9-.2-.7-.1-1.4.2-1.9Z"></path>
                </svg>
            </span>

            <div class="send-zone"
                 onclick="sendMail()">
            </div>

        </div>

    </div>

    <!-- TRANSITION -->

    <div class="fade-transition"></div>

    <div class="copy-toast"
         role="status"
         aria-live="polite">
    </div>

<script>

/* ================= SEND MAIL ================= */

function sendMail(){

    const name =
    document.getElementById("name").value;


    const message =
    document.getElementById("message").value;

    const text =
    encodeURIComponent(

    

        "Nom: " + name + "\n\n" +

       

        message
    );

    const isMobile =
    /Android|iPhone|iPad|iPod/i.test(
        navigator.userAgent
    );

    if(isMobile){

        window.open(

            `https://api.whatsapp.com/send?phone=33766715186&text=${text}`,
            "_self"
        );

    }else{

        window.open(

            `https://wa.me/33766715186?text=${text}`,
            "_blank"
        );
    }
}

/* ================= COPY CONTACT ================= */

const copyToast = document.querySelector(".copy-toast");

function showCopyMessage(message){

    copyToast.textContent = message;
    copyToast.classList.add("visible");

    window.setTimeout(() => {

        copyToast.classList.remove("visible");

    }, 1800);
}

async function copyContact(value, label){

    try{

        await navigator.clipboard.writeText(value);
        showCopyMessage(label + " copié");

    }catch(error){

        const fallback = document.createElement("textarea");

        fallback.value = value;
        fallback.setAttribute("readonly", "");
        fallback.style.position = "fixed";
        fallback.style.opacity = "0";

        document.body.appendChild(fallback);
        fallback.select();
        document.execCommand("copy");
        fallback.remove();

        showCopyMessage(label + " copié");
    }
}

document.querySelectorAll(".contact-copy").forEach(button => {

    button.addEventListener("click", () => {

        const label = button.classList.contains("contact-phone")
            ? "Numéro"
            : "E-mail";

        copyContact(button.dataset.copy, label);
    });
});

</script>

<script src="transitions.js"></script>

</body>

</html>
