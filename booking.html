<!DOCTYPE html>
<html lang="fr">

<head>
    <!-- PRELOAD IMAGES -->

<link rel="preload"
      as="image"
      href="images/transition.PNG"
      fetchpriority="high">



<link rel="preload"
      as="image"
      href="images/DAY.PNG">

<link rel="preload"
      as="image"
      href="images/NIGHT.PNG">

<link rel="preload"
      as="image"
      href="images/BOOKING.PNG">

<!-- PRELOAD GALLERY -->

<link rel="preload"
      as="image"
      href="images/PROMODAY1.PNG">

<link rel="preload"
      as="image"
      href="images/PROMONIGHT1.PNG">

<!-- PRELOAD AUDIO -->

<link rel="preload"
      as="audio"
      href="audio/LOUNGEHOUSE.mp3">

<link rel="preload"
      as="audio"
      href="audio/DEEPHOUSE.mp3">

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Booking</title>

    <link rel="stylesheet"
          href="style.css">

          <!-- PREFETCH PAGES -->

<link rel="prefetch"
      href="day.html">

<link rel="prefetch"
      href="night.html">
      
</head>

<body>

    <!-- FOND FLOU -->

    <div class="blur-background"
         style="background-image:url('images/BOOKING.PNG')">
    </div>

    <!-- OVERLAY -->

    <div class="dark-overlay"></div>

    <!-- PAGE -->

    <div class="page-container">

        <!-- IMAGE -->

        <img src="images/BOOKING.PNG"
             class="page-image">

        <!-- BOUTONS -->

        <a href="day.html"
           class="bubble-link booking-day">
        </a>

        <a href="night.html"
           class="bubble-link booking-night">
        </a>

        <!-- FORMULAIRE BOOKING -->

        <div class="booking-form">

            <!-- NOM -->

            <input type="text"
                   id="name"
                   placeholder="Name:"
                   class="booking-input booking-name">

        
            <!-- MESSAGE -->
<textarea id="message"
          placeholder="Message:"
          class="booking-message"></textarea>
          

            <!-- SEND ZONE -->

            <div class="send-zone"
                 onclick="sendMail()">
            </div>

        </div>

    </div>

    <!-- TRANSITION -->

    <div class="fade-transition"></div>

<script>

/* ================= SEND MAIL ================= */

function sendMail(){

    const name =
    document.getElementById("name").value;


    const message =
    document.getElementById("message").value;

    const text =
    encodeURIComponent(

    

        "Nom: " + name + "\n\n" +

       

        message
    );

    const isMobile =
    /Android|iPhone|iPad|iPod/i.test(
        navigator.userAgent
    );

    if(isMobile){

        window.open(

            `https://api.whatsapp.com/send?phone=33766715186&text=${text}`,
            "_self"
        );

    }else{

        window.open(

            `https://wa.me/33766715186?text=${text}`,
            "_blank"
        );
    }
}

/* ================================================= */
/* ================= PAGE TRANSITION =============== */
/* ================================================= */

window.addEventListener("DOMContentLoaded", () => {

    const fade =
    document.querySelector(".fade-transition");

    if(!fade) return;

    /* ================= FADE IN ================= */

    setTimeout(() => {

        fade.classList.add("hidden");

    }, 50);

    /* ================= FADE OUT ================= */

    document.querySelectorAll("a").forEach(link => {

        link.addEventListener("click", e => {

            const href =
            link.getAttribute("href");

            if(!href) return;

            e.preventDefault();

            fade.classList.remove("hidden");

            setTimeout(() => {

                window.location.href = href;

            }, 800);
        });
    });
});

</script>

</body>

</html>
