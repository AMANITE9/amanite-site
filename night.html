<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Night</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- FOND FLOU -->
    <div class="blur-background"
         style="background-image:url('images/NIGHT.PNG')">
    </div>

    <!-- FILTRE -->
    <div class="dark-overlay"></div>

    <!-- CONTENEUR -->
    <div class="page-container">

        <!-- IMAGE -->
        <img src="images/NIGHT.PNG"
             class="page-image" />

        <!-- ZONES CLIQUABLES -->

        <a href="day.html"
           class="bubble-link night-day">
        </a>

        <a href="booking.html"
           class="bubble-link night-booking">
        </a>
<!-- AUDIO ZONES -->

<div class="audio-zone night-audio-1 demo-bubble"
     data-track="audio/FUNKHOUSE.mp3">
</div>

<div class="audio-zone night-audio-2 demo-bubble"
     data-track="audio/TECHHOUSE.mp3">
</div>


<!-- BARRES PROGRESSION -->

<div class="progress-bar night-progress-1"
     onclick="setProgress(event)">

    <div class="progress-fill"
         id="progress-fill">
    </div>

</div>

<div class="progress-bar night-progress-2"
     onclick="setProgress(event)">

    <div class="progress-fill">
    </div>

</div>


<!-- AUDIO -->

<audio id="audio-player">

    <source src="audio/DEEPHOUSE.mp3"
            type="audio/mpeg">

</audio>

        <!-- GALERIE NIGHT -->

        <div class="promo-gallery">

            <img src="images/PROMONIGHT1.PNG"
                 class="promo-thumb night-thumb1"
                 onclick="openGallery(0)">

            <img src="images/PROMONIGHT2.PNG"
                 class="promo-thumb night-thumb2"
                 onclick="openGallery(1)">

            <img src="images/PROMONIGHT3.PNG"
                 class="promo-thumb night-thumb3"
                 onclick="openGallery(2)">

        </div>

    </div>

    <!-- LIGHTBOX -->

    <div id="lightbox"
         class="lightbox"
         onclick="closeGallery()">

        <!-- ZONE GAUCHE -->

        <div class="lightbox-left"
             onclick="prevImage(event)">
        </div>

        <!-- IMAGE -->

        <img id="lightbox-img"
             class="lightbox-img">

        <!-- ZONE DROITE -->

        <div class="lightbox-right"
             onclick="nextImage(event)">
        </div>

    </div>
<script>

/* ================= GALLERY ================= */

const galleryImages = [

    "images/PROMONIGHT1.PNG",
    "images/PROMONIGHT2.PNG",
    "images/PROMONIGHT3.PNG",
    "images/PROMONIGHT4.PNG",
    "images/PROMONIGHT5.PNG",
    "images/PROMONIGHT6.PNG"

];

let currentImage = 0;

function openGallery(index){

    currentImage = index;

    document.getElementById("lightbox").style.display = "flex";

    document.getElementById("lightbox-img").src =
    galleryImages[currentImage];
}

function closeGallery(){

    document.getElementById("lightbox").style.display = "none";
}

/* ================= NEXT ================= */

function nextImage(event){

    if(event){

        event.stopPropagation();
    }

    currentImage++;

    if(currentImage >= galleryImages.length){

        currentImage = 0;
    }

    document.getElementById("lightbox-img").src =
    galleryImages[currentImage];
}

/* ================= PREV ================= */

function prevImage(event){

    if(event){

        event.stopPropagation();
    }

    currentImage--;

    if(currentImage < 0){

        currentImage =
        galleryImages.length - 1;
    }

    document.getElementById("lightbox-img").src =
    galleryImages[currentImage];
}

/* ================= AUDIO ================= */

const audio =
document.getElementById("audio-player");

const bubbles =
document.querySelectorAll(".demo-bubble");

const progressBars =
document.querySelectorAll(".progress-bar");

const progressFills =
document.querySelectorAll(".progress-fill");

let currentBubble = null;
let currentIndex = 0;

/* ================= PLAY / PAUSE ================= */

bubbles.forEach((bubble, index) => {

    bubble.addEventListener("click", () => {

        const track = bubble.dataset.track;

        /* SI MEME MUSIQUE = PAUSE */

        if(audio.src.includes(track) && !audio.paused){

            audio.pause();

            bubble.classList.remove("playing");

            return;
        }

        /* RESET */

        bubbles.forEach(b => {

            b.classList.remove("playing");
        });

        /* NOUVELLE PISTE */

        audio.src = track;

        audio.play();

        bubble.classList.add("playing");

        currentBubble = bubble;

        currentIndex = index;
    });
});

/* ================= UPDATE PROGRESS ================= */

audio.addEventListener("timeupdate", () => {

    if(!audio.duration) return;

    const progress =

    (audio.currentTime / audio.duration) * 100;

    progressFills.forEach(fill => {

        fill.style.width = "0%";
    });

    progressFills[currentIndex].style.width =
    progress + "%";
});

/* ================= SEEK ================= */

progressBars.forEach((bar, index) => {

    bar.addEventListener("click", (event) => {

        if(index !== currentIndex) return;

        const rect = bar.getBoundingClientRect();

        const clickX = event.clientX - rect.left;

        const percent = clickX / rect.width;

        audio.currentTime =
        percent * audio.duration;
    });
});

/* ================= FIN ================= */

audio.addEventListener("ended", () => {

    bubbles.forEach(b => {

        b.classList.remove("playing");
    });

    progressFills.forEach(fill => {

        fill.style.width = "0%";
    });
});

/* ================= LIGHTBOX ================= */

const lightbox =
document.getElementById("lightbox");

/* ================= TAP OUTSIDE TO CLOSE ================= */

lightbox.addEventListener("click", e => {

    if(e.target === lightbox){

        closeGallery();
    }
});

/* ================================================= */
/* ================= SWIPE MOBILE ================== */
/* ================================================= */

let touchStartX = 0;
let touchEndX = 0;

/* TOUCH START */

lightbox.addEventListener("touchstart", e => {

    touchStartX =
    e.changedTouches[0].screenX;
});

/* TOUCH END */

lightbox.addEventListener("touchend", e => {

    touchEndX =
    e.changedTouches[0].screenX;

    handleSwipe();
});

/* SWIPE DETECTION */

function handleSwipe(){

    const swipeDistance =
    touchEndX - touchStartX;

    /* SWIPE GAUCHE */

    if(swipeDistance < -50){

        nextImage();
    }

    /* SWIPE DROITE */

    if(swipeDistance > 50){

        prevImage();
    }
}

</script>

</body>

</html>
