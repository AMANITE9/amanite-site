<!DOCTYPE html>
<html lang="fr">

<head>

    <!-- PRELOAD PRIORITAIRE TRANSITION -->

    <link rel="preload"
          as="image"
          href="images/transition.webp"
          fetchpriority="high">

    <!-- PRELOAD PAGE ACTUELLE -->

    <link rel="preload"
          as="image"
          href="images/NIGHT.webp">

    <!-- PRELOAD PAGES SUIVANTES -->

    <link rel="preload"
          as="image"
          href="images/DAY.webp">

    <link rel="preload"
          as="image"
          href="images/BOOKING.webp">

    <!-- PRELOAD GALLERY -->

    <link rel="preload"
          as="image"
          href="images/PROMONIGHT12.webp">

    <link rel="preload"
          as="image"
          href="images/PROMONIGHT5.webp">

    <link rel="preload"
          as="image"
          href="images/PROMONIGHT1.webp">

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Night</title>

    <link rel="icon"
          type="image/png"
          href="images/favicon-amanite.png">

    <link rel="stylesheet"
          href="style.css">
          <style>

.demo-bubble.playing{

    animation:
    rgbPulseNight 4s linear infinite;
}

</style>

          <!-- PREFETCH PAGES -->

<link rel="prefetch"
      href="day.html">

<link rel="prefetch"
      href="booking.html">
      

</head>

<body class="page-night">

    <!-- FOND FLOU -->

    <div class="blur-background"
         style="background-image:url('images/NIGHT.webp')">
    </div>

    <!-- FILTRE -->

    <div class="dark-overlay"></div>

    <!-- CONTENEUR -->

    <div class="page-container">

        <!-- IMAGE -->

        <img src="images/NIGHT.webp"
             class="page-image">

        <div class="ambient-atmosphere"
             aria-hidden="true">
            <span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span>
            <span></span><span></span>
            <span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span>
            <span></span><span></span>
            <i class="night-horizon-ray ray-three"></i>
            <i class="night-horizon-ray ray-four"></i>
            <i class="night-horizon-ray ray-five"></i>
            <i class="night-horizon-ray ray-six"></i>
        </div>

        <!-- ZONES CLIQUABLES -->

        <a href="day.html"
           class="bubble-link night-day">
        </a>

        <a href="booking.html"
           class="bubble-link night-booking">
        </a>

        <!-- AUDIO ZONES -->

      <div class="audio-zone night-audio-1 demo-bubble night-bubble"
             data-track="audio/DemoFunk.mp3">
        </div>

        <div class="audio-zone night-audio-2 demo-bubble night-bubble"
             data-track="audio/DemoTechHouse.mp3">
        </div>

        <!-- BARRES PROGRESSION -->

        <div class="progress-bar night-progress-1">

            <div class="progress-fill"
                 id="progress-fill">
            </div>

        </div>

        <div class="progress-bar night-progress-2">

            <div class="progress-fill">
            </div>

        </div>

        <!-- AUDIO -->

        <audio id="audio-player"></audio>

        <!-- GALERIE NIGHT -->

        <div class="promo-gallery">

            <img src="images/PROMONIGHT12.webp"
                 class="promo-thumb night-thumb1"
                 onclick="openGallery(0)">

            <img src="images/PROMONIGHT5.webp"
                 class="promo-thumb night-thumb2"
                 onclick="openGallery(1)">

            <img src="images/PROMONIGHT9.webp"
                 class="promo-thumb night-thumb3"
                 onclick="openGallery(2)">

        </div>

    </div>

    <!-- LIGHTBOX -->

    <div id="lightbox"
         class="lightbox">

        <!-- ZONE GAUCHE -->

        <div class="lightbox-left"
             onclick="prevImage(event)">
        </div>

        <!-- IMAGE -->

        <img id="lightbox-img"
             class="lightbox-img">

        <!-- FLECHES -->

        <div class="gallery-arrow arrow-left">‹</div>

        <div class="gallery-arrow arrow-right">›</div>

        <!-- ZONE DROITE -->

        <div class="lightbox-right"
             onclick="nextImage(event)">
        </div>

    </div>

    <!-- TRANSITION -->

    <div class="fade-transition"></div>

<script>

/* ================= GALLERY ================= */

const galleryImages = [

    "images/PROMONIGHT12.webp",
    "images/PROMONIGHT5.webp",
    "images/PROMONIGHT9.webp",
    "images/PROMONIGHT1.webp",
    "images/PROMONIGHT6.webp",
    "images/PROMONIGHT7.webp",
    "images/PROMONIGHT8.webp",
    "images/PROMONIGHT10.webp",
    "images/PROMONIGHT11.webp",
    

];

let currentImage = 0;

function openGallery(index){

    currentImage = index;

    document.getElementById("lightbox").style.display = "flex";

    document.getElementById("lightbox-img").src =
    galleryImages[currentImage];
}

function closeGallery(){

    document.getElementById("lightbox").style.display = "none";
}

/* ================= NEXT ================= */

function nextImage(event){

    if(event){

        event.stopPropagation();
    }

    currentImage++;

    if(currentImage >= galleryImages.length){

        currentImage = 0;
    }

    document.getElementById("lightbox-img").src =
    galleryImages[currentImage];
}

/* ================= PREV ================= */

function prevImage(event){

    if(event){

        event.stopPropagation();
    }

    currentImage--;

    if(currentImage < 0){

        currentImage =
        galleryImages.length - 1;
    }

    document.getElementById("lightbox-img").src =
    galleryImages[currentImage];
}

/* ================= AUDIO ================= */

const audio =
document.getElementById("audio-player");

const bubbles =
document.querySelectorAll(".demo-bubble");

const nightAtmosphere =
document.querySelector(".page-night .ambient-atmosphere");

const progressBars =
document.querySelectorAll(".progress-bar");

const progressFills =
document.querySelectorAll(".progress-fill");

let currentBubble = null;
let currentIndex = 0;

function resetProgress(){

    progressFills.forEach(fill => {

        fill.style.width = "0%";
    });
}

function updateProgress(){

    if(!Number.isFinite(audio.duration) || audio.duration <= 0) return;

    const progress =
    (audio.currentTime / audio.duration) * 100;

    resetProgress();

    if(progressFills[currentIndex]){

        progressFills[currentIndex].style.width = progress + "%";
    }
}

/* ================= PLAY / PAUSE ================= */

bubbles.forEach((bubble, index) => {

    bubble.addEventListener("click", () => {

        const track = bubble.dataset.track;

        if(audio.src.includes(track) && !audio.paused){

            audio.pause();

            bubble.classList.remove("playing");

            nightAtmosphere?.classList.remove("music-active");

            return;
        }

        bubbles.forEach(b => {

            b.classList.remove("playing");
        });

        currentIndex = index;

        resetProgress();

        audio.src = track;

        audio.load();

        audio.play().catch(() => {

            bubble.classList.remove("playing");
            nightAtmosphere?.classList.remove("music-active");
            resetProgress();
        });

        bubble.classList.add("playing");

        nightAtmosphere?.classList.add("music-active");

        currentBubble = bubble;

    });
});

/* ================= UPDATE PROGRESS ================= */

audio.addEventListener("timeupdate", updateProgress);
audio.addEventListener("loadedmetadata", updateProgress);
audio.addEventListener("durationchange", updateProgress);
audio.addEventListener("playing", updateProgress);

/* ================= SEEK ================= */

progressBars.forEach((bar, index) => {

    bar.addEventListener("click", (event) => {

        if(index !== currentIndex) return;

        const rect = bar.getBoundingClientRect();

        const clickX = event.clientX - rect.left;

        const percent = clickX / rect.width;

        audio.currentTime =
        percent * audio.duration;
    });
});

/* ================= FIN ================= */

audio.addEventListener("ended", () => {

    bubbles.forEach(b => {

        b.classList.remove("playing");
    });

    resetProgress();

    nightAtmosphere?.classList.remove("music-active");
});

audio.addEventListener("pause", () => {

    nightAtmosphere?.classList.remove("music-active");
});

/* ================= LIGHTBOX ================= */

const lightbox =
document.getElementById("lightbox");

/* ================= TAP OUTSIDE TO CLOSE ================= */

lightbox.addEventListener("click", e => {

    if(e.target === lightbox){

        closeGallery();
    }
});

/* ================= SWIPE MOBILE ================= */

let touchStartX = 0;
let touchEndX = 0;

lightbox.addEventListener("touchstart", e => {

    touchStartX =
    e.changedTouches[0].screenX;
});

lightbox.addEventListener("touchend", e => {

    touchEndX =
    e.changedTouches[0].screenX;

    handleSwipe();
});

function handleSwipe(){

    const swipeDistance =
    touchEndX - touchStartX;

    if(swipeDistance < -50){

        nextImage();
    }

    if(swipeDistance > 50){

        prevImage();
    }
}

</script>

<script src="transitions.js"></script>

</body>

</html>
