    bubbleBreath 1.8s ease-in-out infinite;

    <!-- PRELOAD PAGES SUIVANTES -->

    <link rel="preload"
          as="image"
          href="images/NIGHT.webp">

    <link rel="preload"
          as="image"
          href="images/BOOKING.webp">

    <meta charset="UTF-8">

    <meta name="viewport"

    <title>Day</title>

          type="image/png"

    <link rel="stylesheet"
          href="style.css?v=20261109-presskit">

          <link rel="prefetch" href="night.html">
<link rel="prefetch" href="booking.html">

<body class="page-day">

    <div class="blur-background"
         style="background-image:url('images/DAY.webp')">
    </div>

    <!-- FILTRE -->

    <div class="dark-overlay"></div>

    <!-- PAGE -->

    <div class="page-container">

        <!-- IMAGE -->

        <img src="images/DAY.webp"
             class="page-image">

        <div class="ambient-atmosphere"
             aria-hidden="true">
            <span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span>
            <span></span><span></span>
            <span class="day-music-particle"></span>
            <span class="day-music-particle"></span>
            <span class="day-music-particle"></span>
            <span class="day-music-particle"></span>
            <span class="day-music-particle"></span>
            <span class="day-music-particle"></span>
            <span class="day-music-particle"></span>
            <span class="day-music-particle"></span>
            <span class="day-music-particle"></span>
            <span class="day-music-particle"></span>
            <span class="day-music-particle"></span>
            <span class="day-music-particle"></span>
            <span class="day-music-particle"></span>
            <span class="day-music-particle"></span>
            <span class="day-music-particle"></span>
            <span class="day-music-particle"></span>
            <span class="day-music-particle"></span>
            <span class="day-music-particle"></span>
            <span class="day-music-particle"></span>
            <span class="day-music-particle"></span>
            <span class="day-music-particle"></span>
            <span class="day-music-particle"></span>
            <span class="day-music-particle"></span>
            <span class="day-music-particle"></span>
        </div>

        <!-- ZONES CLIQUABLES -->

        <a href="night.html"
           class="bubble-link day-night">
        </a>

        <a href="booking.html"
           class="bubble-link day-booking">
        </a>

        <!-- AUDIO ZONES -->

      <div class="audio-zone audio-zone-1 demo-bubble day-bubble"
             data-track="audio/DemoLounge.mp3">
        </div>

        <div class="audio-zone audio-zone-2 demo-bubble day-bubble"
             data-track="audio/DemoDeep.mp3">
        </div>

        <!-- BARRES PROGRESSION -->

        <div class="progress-bar progress-1">

            <div class="progress-fill"
                 id="progress-fill">
            </div>

            <span class="progress-time"
                  aria-live="off"></span>

        </div>

        <div class="progress-bar progress-2">

            <div class="progress-fill">
            </div>

            <span class="progress-time"
                  aria-live="off"></span>

        </div>

        <!-- AUDIO -->

        <audio id="audio-player"></audio>

        <!-- GALERIE DAY -->

        <div class="promo-gallery">

            <img src="images/PROMODAY11.webp"
                 class="promo-thumb thumb1"
                 onclick="openGallery(0)">

            <img src="images/PROMODAY9.webp"
                 class="promo-thumb thumb2"
                 onclick="openGallery(1)">

            <img src="images/PROMODAY7.webp"
                 class="promo-thumb thumb3"
                 onclick="openGallery(2)">

        </div>

    </div>

    <!-- LIGHTBOX -->

    <div id="lightbox"
         class="lightbox">

        <div class="lightbox-left"
             onclick="prevImage(event)">
        </div>

        <img id="lightbox-img"
             class="lightbox-img">

        <div class="gallery-arrow arrow-left">‹</div>

        <div class="gallery-arrow arrow-right">›</div>

        <div class="lightbox-right"
             onclick="nextImage(event)">
        </div>

    </div>

    <!-- TRANSITION -->

    <div class="fade-transition"></div>

<script>

/* ================= GALLERY ================= */

const galleryImages = [

    "images/PROMODAY11.webp",
    "images/PROMODAY9.webp",
    "images/PROMODAY7.webp",
    "images/PROMODAY1.webp",
    "images/PROMODAY5.webp",
    "images/PROMODAY6.webp",
    "images/PROMODAY8.webp",
    "images/PROMODAY10.webp",
  
    
];

let currentImage = 0;

function openGallery(index){

    currentImage = index;

    document.getElementById("lightbox").style.display = "flex";

    document.getElementById("lightbox-img").src =
    galleryImages[currentImage];
}

function closeGallery(){

    document.getElementById("lightbox").style.display = "none";
}

/* ================= NEXT ================= */

function nextImage(event){

    if(event){

        event.stopPropagation();
    }

    currentImage++;

    if(currentImage >= galleryImages.length){

        currentImage = 0;
    }

    document.getElementById("lightbox-img").src =
    galleryImages[currentImage];
}

/* ================= PREV ================= */

function prevImage(event){

    if(event){

        event.stopPropagation();
    }

    currentImage--;

    if(currentImage < 0){

        currentImage =
        galleryImages.length - 1;
    }

    document.getElementById("lightbox-img").src =
    galleryImages[currentImage];
}

/* ================= AUDIO ================= */

const audio =
document.getElementById("audio-player");

const bubbles =
document.querySelectorAll(".demo-bubble");

const dayAtmosphere =
document.querySelector(".page-day .ambient-atmosphere");

const progressBars =
document.querySelectorAll(".progress-bar");

const progressFills =
document.querySelectorAll(".progress-fill");

const progressTimes =
document.querySelectorAll(".progress-time");

let currentIndex = 0;

function formatAudioTime(seconds){

    if(!Number.isFinite(seconds) || seconds < 0) return "--:--";

    const minutes = Math.floor(seconds / 60);
    const remainingSeconds =
    Math.floor(seconds % 60).toString().padStart(2, "0");

    return minutes + ":" + remainingSeconds;
}

function clearProgressFills(){

    progressFills.forEach(fill => {

        fill.style.width = "0%";
    });
}

function resetProgress(){

    clearProgressFills();

    progressBars.forEach(bar => {

        bar.classList.remove("is-active");
    });

    progressTimes.forEach(time => {

        time.textContent = "";
    });
}

function updateProgress(){

    if(!Number.isFinite(audio.duration) || audio.duration <= 0) return;

    const progress =
    (audio.currentTime / audio.duration) * 100;

    clearProgressFills();

    if(progressFills[currentIndex]){

        progressFills[currentIndex].style.width = progress + "%";
    }

    if(progressTimes[currentIndex]){

        progressTimes[currentIndex].textContent =
        formatAudioTime(audio.currentTime) + " / " +
        formatAudioTime(audio.duration);
    }
}

/* ================= PLAY / PAUSE ================= */

bubbles.forEach((bubble, index) => {

    bubble.addEventListener("click", () => {

        const track = bubble.dataset.track;

        if(audio.src.includes(track) && !audio.paused){

            audio.pause();

            bubble.classList.remove("playing");

            dayAtmosphere?.classList.remove("music-active");

            return;
        }

        bubbles.forEach(b => {

            b.classList.remove("playing");
        });

        currentIndex = index;

        resetProgress();

        progressBars[currentIndex]?.classList.add("is-active");

        if(progressTimes[currentIndex]){

            progressTimes[currentIndex].textContent = "0:00 / --:--";
        }

        audio.src = track;

        audio.load();

        audio.play().catch(() => {

            bubble.classList.remove("playing");
            dayAtmosphere?.classList.remove("music-active");
            resetProgress();
        });

        bubble.classList.add("playing");

        dayAtmosphere?.classList.add("music-active");

    });
});

/* ================= UPDATE PROGRESS ================= */

audio.addEventListener("timeupdate", updateProgress);
audio.addEventListener("loadedmetadata", updateProgress);
audio.addEventListener("durationchange", updateProgress);
audio.addEventListener("playing", updateProgress);

/* ================= SEEK ================= */

progressBars.forEach((bar, index) => {

    bar.addEventListener("click", (event) => {

        if(index !== currentIndex) return;

        const rect = bar.getBoundingClientRect();

        const clickX = event.clientX - rect.left;

        const percent = clickX / rect.width;

        audio.currentTime =
        percent * audio.duration;
    });
});

/* ================= FIN ================= */

audio.addEventListener("ended", () => {

    bubbles.forEach(b => {

        b.classList.remove("playing");
    });

    resetProgress();

    dayAtmosphere?.classList.remove("music-active");

});

audio.addEventListener("pause", () => {

    dayAtmosphere?.classList.remove("music-active");
});

/* ================= LIGHTBOX ================= */

const lightbox =
document.getElementById("lightbox");

/* ================= TAP OUTSIDE TO CLOSE ================= */

lightbox.addEventListener("click", e => {

    if(e.target === lightbox){

        closeGallery();
    }
});

/* ================= SWIPE MOBILE ================= */

let touchStartX = 0;
let touchEndX = 0;

lightbox.addEventListener("touchstart", e => {

    touchStartX =
    e.changedTouches[0].screenX;
});

lightbox.addEventListener("touchend", e => {

    touchEndX =
    e.changedTouches[0].screenX;

    handleSwipe();
});

function handleSwipe(){

    const swipeDistance =
    touchEndX - touchStartX;

    if(swipeDistance < -50){

        nextImage();
    }

    if(swipeDistance > 50){

        prevImage();
    }
}

</script>

<script src="transitions.js"></script>

</body>

</html>
