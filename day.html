<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Day</title>

    <link rel="stylesheet"
          href="style.css">
</head>

<body>

    <!-- FOND FLOU -->
    <div class="blur-background"
         style="background-image:url('images/DAY.PNG')">
    </div>

    <!-- FILTRE -->
    <div class="dark-overlay"></div>

    <!-- PAGE -->
    <div class="page-container">

        <!-- IMAGE -->
        <img src="images/DAY.PNG"
             class="page-image">

        <!-- ZONES CLIQUABLES -->

        <a href="night.html"
           class="bubble-link day-night">
        </a>

        <a href="booking.html"
           class="bubble-link day-booking">
        </a>

        <!-- AUDIO ZONES -->

        <div class="audio-zone audio-zone-1 demo-bubble"
             data-track="audio/LOUNGEHOUSE.mp3">
        </div>

        <div class="audio-zone audio-zone-2 demo-bubble"
             data-track="audio/DEEPHOUSE.mp3">
        </div>

        <!-- BARRES PROGRESSION -->

        <div class="progress-bar progress-1">

            <div class="progress-fill"
                 id="progress-fill">
            </div>

        </div>

        <div class="progress-bar progress-2">

            <div class="progress-fill">
            </div>

        </div>

        <!-- AUDIO -->

        <audio id="audio-player"></audio>

        <!-- GALERIE DAY -->

        <div class="promo-gallery">

            <img src="images/PROMODAY1.PNG"
                 class="promo-thumb thumb1"
                 onclick="openGallery(0)">

            <img src="images/PROMODAY2.PNG"
                 class="promo-thumb thumb2"
                 onclick="openGallery(1)">

            <img src="images/PROMODAY3.PNG"
                 class="promo-thumb thumb3"
                 onclick="openGallery(2)">

        </div>

    </div>

    <!-- LIGHTBOX -->

    <div id="lightbox"
         class="lightbox">

        <!-- ZONE GAUCHE -->

        <div class="lightbox-left"
             onclick="prevImage(event)">
        </div>

        <!-- IMAGE -->

        <img id="lightbox-img"
             class="lightbox-img">

        <!-- FLECHES -->

        <div class="gallery-arrow arrow-left">‹</div>

        <div class="gallery-arrow arrow-right">›</div>

        <!-- ZONE DROITE -->

        <div class="lightbox-right"
             onclick="nextImage(event)">
        </div>

    </div>

    <!-- TRANSITION -->

    <div class="fade-transition"></div>

<script>

/* ================= GALLERY ================= */

const galleryImages = [

    "images/PROMODAY1.PNG",
    "images/PROMODAY2.PNG",
    "images/PROMODAY3.PNG",
    "images/PROMODAY4.PNG",
    "images/PROMODAY5.PNG",
    "images/PROMODAY6.PNG"

];

let currentImage = 0;

function openGallery(index){

    currentImage = index;

    document.getElementById("lightbox").style.display = "flex";

    document.getElementById("lightbox-img").src =
    galleryImages[currentImage];
}

function closeGallery(){

    document.getElementById("lightbox").style.display = "none";
}

/* ================= NEXT ================= */

function nextImage(event){

    if(event){

        event.stopPropagation();
    }

    currentImage++;

    if(currentImage >= galleryImages.length){

        currentImage = 0;
    }

    document.getElementById("lightbox-img").src =
    galleryImages[currentImage];
}

/* ================= PREV ================= */

function prevImage(event){

    if(event){

        event.stopPropagation();
    }

    currentImage--;

    if(currentImage < 0){

        currentImage =
        galleryImages.length - 1;
    }

    document.getElementById("lightbox-img").src =
    galleryImages[currentImage];
}

/* ================= AUDIO ================= */

const audio =
document.getElementById("audio-player");

const bubbles =
document.querySelectorAll(".demo-bubble");

const progressBars =
document.querySelectorAll(".progress-bar");

const progressFills =
document.querySelectorAll(".progress-fill");

let currentBubble = null;
let currentIndex = 0;

/* ================= PLAY / PAUSE ================= */

bubbles.forEach((bubble, index) => {

    bubble.addEventListener("click", () => {

        const track = bubble.dataset.track;

        if(audio.src.includes(track) && !audio.paused){

            audio.pause();

            bubble.classList.remove("playing");

            return;
        }

        bubbles.forEach(b => {

            b.classList.remove("playing");
        });

        audio.src = track;

        audio.play();

        bubble.classList.add("playing");

        currentBubble = bubble;

        currentIndex = index;
    });
});

/* ================= UPDATE PROGRESS ================= */

audio.addEventListener("timeupdate", () => {

    if(!audio.duration) return;

    const progress =

    (audio.currentTime / audio.duration) * 100;

    progressFills.forEach(fill => {

        fill.style.width = "0%";
    });

    progressFills[currentIndex].style.width =
    progress + "%";
});

/* ================= SEEK ================= */

progressBars.forEach((bar, index) => {

    bar.addEventListener("click", (event) => {

        if(index !== currentIndex) return;

        const rect = bar.getBoundingClientRect();

        const clickX = event.clientX - rect.left;

        const percent = clickX / rect.width;

        audio.currentTime =
        percent * audio.duration;
    });
});

/* ================= FIN ================= */

audio.addEventListener("ended", () => {

    bubbles.forEach(b => {

        b.classList.remove("playing");
    });

    progressFills.forEach(fill => {

        fill.style.width = "0%";
    });
});

/* ================= LIGHTBOX ================= */

const lightbox =
document.getElementById("lightbox");

/* ================= TAP OUTSIDE TO CLOSE ================= */

lightbox.addEventListener("click", e => {

    if(e.target === lightbox){

        closeGallery();
    }
});

/* ================= SWIPE MOBILE ================= */

let touchStartX = 0;
let touchEndX = 0;

lightbox.addEventListener("touchstart", e => {

    touchStartX =
    e.changedTouches[0].screenX;
});

lightbox.addEventListener("touchend", e => {

    touchEndX =
    e.changedTouches[0].screenX;

    handleSwipe();
});

function handleSwipe(){

    const swipeDistance =
    touchEndX - touchStartX;

    if(swipeDistance < -50){

        nextImage();
    }

    if(swipeDistance > 50){

        prevImage();
    }
}
/* ================================================= */
/* ================= PAGE TRANSITION =============== */
/* ================================================= */

window.addEventListener("DOMContentLoaded", () => {

    const fade =
    document.querySelector(".fade-transition");

    if(!fade) return;

    /* ================= FADE IN ================= */

    setTimeout(() => {

        fade.classList.add("hidden");

    }, 50);

    /* ================= FADE OUT ================= */

    document.querySelectorAll("a").forEach(link => {

        link.addEventListener("click", e => {

            const href =
            link.getAttribute("href");

            if(!href) return;

            e.preventDefault();

            fade.classList.remove("hidden");

            setTimeout(() => {

                window.location.href = href;

            }, 800);
        });
    });
})

</script>


</body>

</html>
