<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Day</title>

    <link rel="stylesheet"
          href="style.css">
</head>

<body>

    <!-- FOND FLOU -->
    <div class="blur-background"
         style="background-image:url('images/DAY.PNG')">
    </div>

    <!-- FILTRE -->
    <div class="dark-overlay"></div>

    <!-- PAGE -->
    <div class="page-container">

        <!-- IMAGE -->
        <img src="images/DAY.PNG"
             class="page-image">

        <!-- ZONES CLIQUABLES -->

        <a href="night.html"
           class="bubble-link day-night">
        </a>

        <a href="booking.html"
           class="bubble-link day-booking">
        </a>

        <!-- AUDIO ZONES -->

<div class="audio-zone audio-zone-1 demo-bubble"
     data-track="audio/LOUNGEHOUSE.mp3">
</div>

<div class="audio-zone audio-zone-2 demo-bubble"
     data-track="audio/DEEPHOUSE.mp3">
</div>


        <!-- BARRES PROGRESSION -->
<div class="progress-bar progress-1"
     onclick="setProgress(event)">

    <div class="progress-fill"
         id="progress-fill">
    </div>

</div>

<div class="progress-bar progress-2"
     onclick="setProgress(event)">

    <div class="progress-fill">
    </div>

</div>

        

        <!-- BARRES VOLUME -->

        <input type="range"
               min="0"
               max="1"
               step="0.01"
               value="1"
               class="volume-bar volume-1"
               onchange="changeVolume(this.value)">

        <input type="range"
               min="0"
               max="1"
               step="0.01"
               value="1"
               class="volume-bar volume-2"
               onchange="changeVolume(this.value)">

        <!-- AUDIO -->

        <audio id="audio-player">

            <source src="audio/DEEPHOUSE.mp3"
                    type="audio/mpeg">

        </audio>

        <!-- GALERIE DAY -->

        <div class="promo-gallery">

            <img src="images/PROMODAY1.PNG"
                 class="promo-thumb thumb1"
                 onclick="openGallery(0)">

            <img src="images/PROMODAY2.PNG"
                 class="promo-thumb thumb2"
                 onclick="openGallery(1)">

            <img src="images/PROMODAY3.PNG"
                 class="promo-thumb thumb3"
                 onclick="openGallery(2)">

        </div>

    </div>

    <!-- LIGHTBOX -->

    <div id="lightbox"
         class="lightbox"
         onclick="closeGallery()">

        <!-- ZONE GAUCHE -->

        <div class="lightbox-left"
             onclick="prevImage(event)">
        </div>

        <!-- IMAGE -->

        <img id="lightbox-img"
             class="lightbox-img">

        <!-- ZONE DROITE -->

        <div class="lightbox-right"
             onclick="nextImage(event)">
        </div>

    </div>

  <script>

    /* ================= GALLERY ================= */

    const galleryImages = [

        "images/PROMODAY1.PNG",
        "images/PROMODAY2.PNG",
        "images/PROMODAY3.PNG",
        "images/PROMODAY4.PNG",
        "images/PROMODAY5.PNG",
        "images/PROMODAY6.PNG"

    ];

    let currentImage = 0;

    function openGallery(index){

        currentImage = index;

        document.getElementById("lightbox").style.display = "flex";

        document.getElementById("lightbox-img").src =
        galleryImages[currentImage];
    }

    function closeGallery(){

        document.getElementById("lightbox").style.display = "none";
    }

    function nextImage(event){

        event.stopPropagation();

        currentImage++;

        if(currentImage >= galleryImages.length){

            currentImage = 0;
        }

        document.getElementById("lightbox-img").src =
        galleryImages[currentImage];
    }

    function prevImage(event){

        event.stopPropagation();

        currentImage--;

        if(currentImage < 0){

            currentImage = galleryImages.length - 1;
        }

        document.getElementById("lightbox-img").src =
        galleryImages[currentImage];
    }

    /* ================= AUDIO ================= */

    const audio =
    document.getElementById("audio-player");

    const bubbles =
    document.querySelectorAll(".demo-bubble");

    const progressBars =
    document.querySelectorAll(".progress-fill");

    let currentBubble = null;

    /* ================= CREATION ICONES ================= */

    bubbles.forEach(bubble => {

        const icon =
        document.createElement("div");

        icon.classList.add("play-icon");

        icon.innerHTML = "▶";

        bubble.appendChild(icon);
    });

    /* ================= PLAY / PAUSE ================= */

    bubbles.forEach(bubble => {

        bubble.addEventListener("click", () => {

            const track =
            bubble.dataset.track;

            const icon =
            bubble.querySelector(".play-icon");

            /* MEME PISTE = PAUSE */

            if(audio.src.includes(track)
            && !audio.paused){

                audio.pause();

                bubble.classList.remove("playing");

                icon.innerHTML = "▶";

                return;
            }

            /* RESET AUTRES BULLES */

            bubbles.forEach(b => {

                b.classList.remove("playing");

                const otherIcon =
                b.querySelector(".play-icon");

                otherIcon.innerHTML = "▶";
            });

            /* NOUVELLE PISTE */

            audio.src = track;

            audio.play();

            bubble.classList.add("playing");

            icon.innerHTML = "❚❚";

            currentBubble = bubble;
        });
    });

    /* ================= VOLUME ================= */

    function changeVolume(value){

        audio.volume = value;
    }

    /* ================= PROGRESSION ================= */

    audio.addEventListener("timeupdate", () => {

        if(!audio.duration) return;

        const progress =

        (audio.currentTime / audio.duration) * 100;

        progressBars.forEach(bar => {

            bar.style.width =
            progress + "%";
        });
    });

    /* ================= CLIQUER BARRE ================= */

    function setProgress(event){

        const bar = event.currentTarget;

        const rect = bar.getBoundingClientRect();

        const clickX = event.clientX - rect.left;

        const width = rect.width;

        const percent = clickX / width;

        audio.currentTime =
        percent * audio.duration;
    }

    /* ================= FIN MUSIQUE ================= */

    audio.addEventListener("ended", () => {

        if(currentBubble){

            currentBubble.classList.remove("playing");

            const icon =
            currentBubble.querySelector(".play-icon");

            icon.innerHTML = "▶";
        }

        progressBars.forEach(bar => {

            bar.style.width = "0%";
        });
    });

</script>


</body>

</html>
