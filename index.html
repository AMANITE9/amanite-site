<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Amanite</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- FOND FLOU -->
    <div class="blur-background"
         style="background-image:url('images/HOME.PNG')">
    </div>

    <!-- FILTRE SOMBRE -->
    <div class="dark-overlay"></div>

    <!-- IMAGE PRINCIPALE -->
    <div class="page-container">

        <img src="images/HOME.PNG"
             class="page-image">
<!-- ZONES CLIQUABLES -->

<a href="day.html"
   class="bubble-link home-day">
</a>

<a href="night.html"
   class="bubble-link home-night">
</a>

<a href="booking.html"
   class="bubble-link home-booking">
</a>
    </div>

    <div class="fade-transition"></div>
    
  <script>

/* ================================================= */
/* ================= PAGE TRANSITION =============== */
/* ================================================= */

window.addEventListener("DOMContentLoaded", () => {

    const fade =
    document.querySelector(".fade-transition");

    if(!fade) return;

    /* ================= FADE IN ================= */

    setTimeout(() => {

        fade.classList.add("hidden");

    }, 50);

    /* ================= FADE OUT ================= */

    document.querySelectorAll("a").forEach(link => {

        link.addEventListener("click", e => {

            const href =
            link.getAttribute("href");

            if(!href) return;

            e.preventDefault();

            fade.classList.remove("hidden");

            setTimeout(() => {

                window.location.href = href;

            }, 800);
        });
    });
});

</script>



</body>

</html>
